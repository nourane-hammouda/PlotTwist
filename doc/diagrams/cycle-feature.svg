<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="45mm" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de réalisation d’une feature selon les dix compétences</title>
  <desc id="desc">Une feature passe par idéation, conception, spécification, algorithmique, code, tests, CI/CD, rédaction, débogage et validation. Les critères d’acceptation sont vérifiés dans la CI puis lors d’une démonstration de bout en bout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7565d8"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #252a3b; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 700; }
    .detail { font-size: 11.5px; fill: #555b70; }
    .step { fill: #f0eefc; stroke: #b8aff0; stroke-width: 2; }
    .test { fill: #e9f6f0; stroke: #83c7a7; stroke-width: 2; }
    .arrow { stroke: #7565d8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <text x="32" y="38" class="title">Une feature suit les dix compétences de l’araignée</text>
  <rect x="10" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="60" y="122" text-anchor="middle" class="label">1 · Idéation</text>
  <text x="60" y="154" text-anchor="middle" class="detail">Besoin</text>
  <text x="60" y="176" text-anchor="middle" class="detail">et valeur</text>
  <path d="M113 146H125" class="arrow"/>
  <rect x="128" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="178" y="122" text-anchor="middle" class="label">2 · Conception</text>
  <text x="178" y="154" text-anchor="middle" class="detail">Flux et</text>
  <text x="178" y="176" text-anchor="middle" class="detail">composants</text>
  <path d="M231 146H243" class="arrow"/>
  <rect x="246" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="296" y="122" text-anchor="middle" class="label">3 · Spécification</text>
  <text x="296" y="154" text-anchor="middle" class="detail">Critères et</text>
  <text x="296" y="176" text-anchor="middle" class="detail">invariants</text>
  <path d="M349 146H361" class="arrow"/>
  <rect x="364" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="414" y="122" text-anchor="middle" class="label">4 · Algorithmique</text>
  <text x="414" y="154" text-anchor="middle" class="detail">Choix et</text>
  <text x="414" y="176" text-anchor="middle" class="detail">complexité</text>
  <path d="M467 146H479" class="arrow"/>
  <rect x="482" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="532" y="122" text-anchor="middle" class="label">5 · Code</text>
  <text x="532" y="154" text-anchor="middle" class="detail">Tranche</text>
  <text x="532" y="176" text-anchor="middle" class="detail">verticale</text>
  <path d="M585 146H597" class="arrow"/>
  <rect x="600" y="86" width="100" height="120" rx="12" class="test"/>
  <text x="650" y="122" text-anchor="middle" class="label">6 · Tests</text>
  <text x="650" y="154" text-anchor="middle" class="detail">Unitaires et</text>
  <text x="650" y="176" text-anchor="middle" class="detail">intégration</text>
  <path d="M703 146H715" class="arrow"/>
  <rect x="718" y="86" width="100" height="120" rx="12" class="test"/>
  <text x="768" y="122" text-anchor="middle" class="label">7 · CI/CD</text>
  <text x="768" y="154" text-anchor="middle" class="detail">GitHub</text>
  <text x="768" y="176" text-anchor="middle" class="detail">Actions</text>
  <path d="M821 146H833" class="arrow"/>
  <rect x="836" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="886" y="122" text-anchor="middle" class="label">8 · Rédaction</text>
  <text x="886" y="154" text-anchor="middle" class="detail">Docs et</text>
  <text x="886" y="176" text-anchor="middle" class="detail">déclaration IA</text>
  <path d="M939 146H951" class="arrow"/>
  <rect x="954" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="1004" y="122" text-anchor="middle" class="label">9 · Débogage</text>
  <text x="1004" y="154" text-anchor="middle" class="detail">Reproduction</text>
  <text x="1004" y="176" text-anchor="middle" class="detail">et correction</text>
  <path d="M1057 146H1069" class="arrow"/>
  <rect x="1072" y="86" width="100" height="120" rx="12" class="step"/>
  <text x="1122" y="122" text-anchor="middle" class="label">10 · Validation</text>
  <text x="1122" y="154" text-anchor="middle" class="detail">Démo et</text>
  <text x="1122" y="176" text-anchor="middle" class="detail">acceptation</text>
  <path d="M60 217V244H1122V217" stroke="#299c70" stroke-width="2" stroke-dasharray="7 7" fill="none"/>
  <text x="591" y="275" text-anchor="middle" class="detail">Critères vérifiés à chaque étape · tests unitaires, intégration et validation en CI</text>
</svg>
