  <text x="600" y="264" class="detail">Bas niveau : R1 16 % · plafond moyen 51 %</text>
  <text x="600" y="312" class="detail">F1 par axe : idéation 25 · conception 15 %</text>
  <text x="600" y="336" class="detail">Spécification 25 · algorithmique 10 · validation 0 %</text>
  <text x="600" y="360" class="detail">Code 25 · tests 20 · CI/CD 20 · rédaction 40 · débogage 15 %</text>
  <text x="600" y="392" class="tick">Plafonds par axe détaillés dans le tableau de l’annexe.</text>
