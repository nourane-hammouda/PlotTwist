name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build + tests + rapport JaCoCo
        run: mvn --batch-mode verify

      - name: Publication du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  doc:
    name: Compilation du dossier PDF
    runs-on: ubuntu-latest
    if: contains(github.event.commits[0].modified, 'doc/')

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de WeasyPrint et Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc python3-pip
          pip3 install weasyprint

      - name: Compilation du dossier PDF
        run: make -C doc

      - name: Publication du PDF
        uses: actions/upload-artifact@v4
        with:
          name: dossier-pdf
          path: doc/dossier-lancement.pdf
